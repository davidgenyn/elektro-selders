<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab-schema Elektro Selders</title>
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: Arial, Helvetica, sans-serif; color: #2c2c2a; }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
  p { font-size: 14px; margin: 0 0 16px; color: #5f5e5a; }
  svg { max-width: 760px; width: 100%; height: auto; display: block; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; }
  .bedrijf rect { fill: #EEEDFE; stroke: #534AB7; }
  .bedrijf .th { fill: #3C3489; }
  .bedrijf .ts { fill: #534AB7; }
  .gast rect { fill: #FAEEDA; stroke: #BA7517; }
  .gast .th { fill: #633806; }
  .gast .ts { fill: #854F0B; }
  .thuis rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .thuis .th { fill: #444441; }
  .thuis .ts { fill: #5F5E5A; }
  .zone rect { fill: #E1F5EE; stroke: #0F6E56; }
  .zone .th { fill: #085041; }
  .net rect { fill: none; stroke: #534AB7; stroke-dasharray: 5 4; }
  .net .th { fill: #3C3489; }
  .net .ts { fill: #534AB7; }
  .later rect { fill: none; stroke: #888780; stroke-dasharray: 4 4; }
  .later .th { fill: #444441; }
  .later .ts { fill: #5F5E5A; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .dash { stroke: #5F5E5A; stroke-width: 1; fill: none; stroke-dasharray: 4 4; }
  .leg { fill: #444441; font-size: 12px; }
</style>
</head>
<body>
<h1>Test-kmo Elektro Selders — labopstelling</h1>
<p>Stand 10 november 2026. CyFun Small, zonder Netgate, zonder Microsoft 365 (later).</p>
<svg viewBox="0 0 680 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lab-schema Elektro Selders">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="thuis"><rect x="280" y="40" width="120" height="44" rx="8" stroke-width="1"/><text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central">Internet</text></g>
<line x1="340" y1="84" x2="340" y2="122" class="arr" marker-end="url(#arrow)"/>

<g class="thuis"><rect x="240" y="124" width="200" height="56" rx="8" stroke-width="1"/><text class="th" x="340" y="142" text-anchor="middle" dominant-baseline="central">Proximus-modem</text><text class="ts" x="340" y="162" text-anchor="middle" dominant-baseline="central">Jouw thuisnetwerk</text></g>

<g class="later"><rect x="470" y="124" width="170" height="56" rx="8" stroke-width="1"/><text class="th" x="555" y="142" text-anchor="middle" dominant-baseline="central">Microsoft 365</text><text class="ts" x="555" y="162" text-anchor="middle" dominant-baseline="central">Later, lotusflow.net</text></g>

<g class="zone"><rect x="40" y="220" width="600" height="270" rx="20" stroke-width="1"/><text class="th" x="60" y="244">Elektro Selders (lab)</text></g>
<line x1="340" y1="180" x2="340" y2="258" class="arr" marker-end="url(#arrow)"/>

<g class="bedrijf"><rect x="230" y="260" width="220" height="56" rx="8" stroke-width="1"/><text class="th" x="340" y="278" text-anchor="middle" dominant-baseline="central">ASUS RT-AX55</text><text class="ts" x="340" y="298" text-anchor="middle" dominant-baseline="central">Providerrouter en firewall</text></g>

<path d="M290 316 L290 336 L220 336 L220 356" class="arr" marker-end="url(#arrow)"/>
<path d="M390 316 L390 336 L535 336 L535 356" class="arr" marker-end="url(#arrow)"/>

<g class="net"><rect x="60" y="358" width="340" height="112" rx="12" stroke-width="1"/><text class="th" x="230" y="378" text-anchor="middle" dominant-baseline="central">Kantoornetwerk</text><text class="ts" x="230" y="394" text-anchor="middle" dominant-baseline="central">Eén netwerk, kabel en wifi samen</text></g>
<g class="bedrijf"><rect x="76" y="406" width="150" height="50" rx="8" stroke-width="1"/><text class="th" x="151" y="423" text-anchor="middle" dominant-baseline="central">Kantoor-pc (VM)</text><text class="ts" x="151" y="441" text-anchor="middle" dominant-baseline="central">Via kabel, Win 11</text></g>
<g class="bedrijf"><rect x="236" y="406" width="150" height="50" rx="8" stroke-width="1"/><text class="th" x="311" y="423" text-anchor="middle" dominant-baseline="central">Kantoorwifi</text><text class="ts" x="311" y="441" text-anchor="middle" dominant-baseline="central">Eigen toestellen</text></g>

<g class="gast"><rect x="450" y="358" width="170" height="112" rx="12" stroke-width="1"/><text class="th" x="535" y="396" text-anchor="middle" dominant-baseline="central">Gastnetwerk</text><text class="ts" x="535" y="416" text-anchor="middle" dominant-baseline="central">Alleen internet</text><text class="ts" x="535" y="434" text-anchor="middle" dominant-baseline="central">Geen toegang tot kantoor</text></g>

<g class="thuis"><rect x="60" y="530" width="220" height="56" rx="8" stroke-width="1"/><text class="th" x="170" y="548" text-anchor="middle" dominant-baseline="central">Laptop (host)</text><text class="ts" x="170" y="568" text-anchor="middle" dominant-baseline="central">Dock naar thuisnetwerk</text></g>
<line x1="151" y1="530" x2="151" y2="458" class="dash"/>
<path d="M60 558 L24 558 L24 152 L238 152" class="arr" marker-end="url(#arrow)"/>

<g class="thuis"><rect x="420" y="530" width="220" height="56" rx="8" stroke-width="1"/><text class="th" x="530" y="548" text-anchor="middle" dominant-baseline="central">USB-schijf</text><text class="ts" x="530" y="568" text-anchor="middle" dominant-baseline="central">Back-up, offline bewaard</text></g>
<path d="M200 456 L200 505 L530 505 L530 528" class="dash" marker-end="url(#arrow)"/>

<rect x="60" y="606" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/>
<text class="leg" x="82" y="617">Kantoor</text>
<rect x="150" y="606" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#BA7517"/>
<text class="leg" x="172" y="617">Gast</text>
<rect x="230" y="606" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
<text class="leg" x="252" y="617">Jouw thuis</text>
<line x1="350" y1="613" x2="380" y2="613" class="dash"/>
<text class="leg" x="388" y="617">Later of offline</text>
</svg>
</body>
</html>
