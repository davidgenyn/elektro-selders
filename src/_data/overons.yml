seo:
  titel: Over ons – 18 jaar ervaring als elektricien in Achel
  omschrijving: Jan Selders is al 18 jaar elektricien in Achel. Erkend, verzekerd en met 5 jaar garantie op installaties. Werkgebied Hamont-Achel, Pelt, Lommel, Bocholt en Peer.
titel: Over Elektro Selders
foto: /images/uploads/jan.jpg
tekst: |
  Elektro Selders is het bedrijf van Jan Selders, elektricien in Achel sinds 2008. Wat begon als eenmanszaak is uitgegroeid tot een kleine ploeg die alle elektriciteitswerken aankan: van een storing om middernacht tot een volledige nieuwbouwinstallatie.

  Wij werken met vaste prijzen. U weet vooraf wat het kost, en dat blijft zo. Op onze installaties geven we 5 jaar garantie, en elke installatie wordt gekeurd zonder opmerkingen.
